<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CalAI Pro - Nutrition & Macros</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF7E67;
            --secondary: #FFB3A6;
            --bg: #F4F7F8;
            --card: #FFFFFF;
            --text: #2D3142;
            --text-light: #9095A0;
            --protein: #4CAF50;
            --carbs: #2196F3;
            --fat: #FFC107;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        /* Dashboard Header */
        .header {
            background: linear-gradient(135deg, var(--text), #1A1D28);
            color: white;
            padding: 30px 20px 40px;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            position: relative;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 8px;}
        .settings-btn { background: rgba(255,255,255,0.15); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        
        /* Calorie Circle */
        .cal-circle-container { display: flex; justify-content: center; margin-bottom: 25px; }
        .cal-circle {
            width: 160px; height: 160px;
            border-radius: 50%;
            border: 8px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transform: rotate(-45deg);
        }
        .cal-content { transform: rotate(45deg); text-align: center; }
        .cal-remain { font-size: 40px; font-weight: 700; line-height: 1; }
        .cal-label { font-size: 12px; opacity: 0.8; margin-top: 5px; }

        /* Macro Bars */
        .macros { display: flex; justify-content: space-between; gap: 15px; }
        .macro-col { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .m-title { font-size: 11px; opacity: 0.8; text-transform: uppercase; font-weight: 600; }
        .m-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .m-bar { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .m-val { font-size: 12px; font-weight: 600; }
        
        /* Container */
        .container { padding: 20px; margin-top: -20px; position: relative; z-index: 10; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Upload Area */
        .upload-area {
            border: 2px dashed #E5E7EB; border-radius: 16px; padding: 30px 20px;
            text-align: center; cursor: pointer; position: relative; background: #FAFAFA; transition: 0.2s;
        }
        .upload-area:active { background: #F3F4F6; }
        .upload-area input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        #preview { width: 100%; border-radius: 12px; display: none; object-fit: cover; max-height: 250px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* Buttons */
        .btn {
            background: var(--primary); color: white; border: none; padding: 16px;
            border-radius: 14px; font-size: 16px; font-weight: 600; width: 100%;
            cursor: pointer; box-shadow: 0 6px 15px rgba(255, 126, 103, 0.3); transition: 0.2s; margin-top: 15px; display: none;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #E5E7EB; color: #9CA3AF; box-shadow: none; pointer-events: none; }

        /* Loader */
        .loader {
            border: 3px solid #f3f3f3; border-top: 3px solid var(--primary);
            border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* AI Result Box */
        .result-box { display: none; margin-top: 15px; background: #F9FAFB; padding: 15px; border-radius: 14px; border: 1px solid #E5E7EB; }
        .r-name { font-size: 18px; font-weight: 700; margin-bottom: 5px; color: var(--primary); }
        .r-macros { display: flex; gap: 10px; margin-bottom: 10px; font-size: 12px; font-weight: 600; }
        .r-desc { font-size: 13px; color: var(--text-light); line-height: 1.5; }

        /* History */
        .history-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #F3F4F6; }
        .history-item:last-child { border-bottom: none; padding-bottom: 0; }
        .h-img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; margin-right: 15px; }
        .h-info { flex: 1; }
        .h-name { font-weight: 600; font-size: 15px; }
        .h-time { font-size: 12px; color: var(--text-light); }
        .h-cal { font-weight: 700; color: var(--text); font-size: 15px; text-align: right; }
        .h-mac { font-size: 11px; color: var(--text-light); text-align: right; }
        .clear-btn { font-size: 12px; color: #EF4444; background: none; border: none; cursor: pointer; }

        /* Modal (Profile Setup) */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: flex-end; backdrop-filter: blur(5px); }
        .modal.active { display: flex; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .modal-content { background: white; padding: 25px; border-radius: 24px 24px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-light); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #E5E7EB; border-radius: 10px; font-size: 15px; }
        .flex-row { display: flex; gap: 10px; }
        .btn-save { background: var(--text); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: 600; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Dashboard Header -->
    <div class="header">
        <div class="header-top">
            <h1>CalAI Pro 🥑</h1>
            <button class="settings-btn" onclick="openProfile()">👤</button>
        </div>

        <div class="cal-circle-container">
            <div class="cal-circle" id="circleBorder">
                <div class="cal-content">
                    <div class="cal-remain" id="calRemain">0</div>
                    <div class="cal-label">Kcal Left</div>
                </div>
            </div>
        </div>

        <div class="macros">
            <div class="macro-col">
                <div class="m-title" style="color:var(--protein)">Protein</div>
                <div class="m-bar-bg"><div class="m-bar" id="barPro" style="background:var(--protein); width: 0%;"></div></div>
                <div class="m-val" id="textPro">0 / 0g</div>
            </div>
            <div class="macro-col">
                <div class="m-title" style="color:var(--carbs)">Carbs</div>
                <div class="m-bar-bg"><div class="m-bar" id="barCarb" style="background:var(--carbs); width: 0%;"></div></div>
                <div class="m-val" id="textCarb">0 / 0g</div>
            </div>
            <div class="macro-col">
                <div class="m-title" style="color:var(--fat)">Fat</div>
                <div class="m-bar-bg"><div class="m-bar" id="barFat" style="background:var(--fat); width: 0%;"></div></div>
                <div class="m-val" id="textFat">0 / 0g</div>
            </div>
        </div>
    </div>

    <!-- Main Cards -->
    <div class="container">
        <!-- Scan Card -->
        <div class="card">
            <div class="card-title">📸 สแกนอาหาร</div>
            <div class="upload-area" id="uploadArea">
                <div id="uploadPlaceholder">
                    <div class="upload-icon">🍽️</div>
                    <p style="color: var(--text-light); font-size: 14px;">แตะเพื่อถ่ายรูป หรือเลือกจากคลัง</p>
                </div>
                <img id="preview" alt="Preview">
                <input type="file" id="imageInput" accept="image/*">
            </div>
            <button id="analyzeBtn" class="btn" onclick="analyzeFood()">✨ วิเคราะห์สารอาหาร (AI)</button>
            <div class="loader" id="loader"></div>
            
            <div class="result-box" id="resultText"></div>
        </div>

        <!-- History Card -->
        <div class="card">
            <div class="card-title">
                <span>🕒 ประวัติวันนี้</span>
                <button class="clear-btn" onclick="clearHistory()">ล้างข้อมูล</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal" id="profileModal">
        <div class="modal-content">
            <h2 style="font-size: 20px; margin-bottom: 20px;">👤 ข้อมูลส่วนตัว (คำนวณ TDEE)</h2>
            <div class="flex-row">
                <div class="form-group" style="flex:1;">
                    <label>เพศ</label>
                    <select id="i-gender"><option value="M">ชาย</option><option value="F">หญิง</option></select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>อายุ (ปี)</label>
                    <input type="number" id="i-age" placeholder="25">
                </div>
            </div>
            <div class="flex-row">
                <div class="form-group" style="flex:1;">
                    <label>น้ำหนัก (กก.)</label>
                    <input type="number" id="i-weight" placeholder="70">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>ส่วนสูง (ซม.)</label>
                    <input type="number" id="i-height" placeholder="170">
                </div>
            </div>
            <div class="form-group">
                <label>กิจกรรมต่อสัปดาห์</label>
                <select id="i-activity">
                    <option value="1.2">นั่งทำงาน (ไม่ออกกำลังกาย)</option>
                    <option value="1.375">ขยับเบาๆ (ออกกำลัง 1-3 วัน/สัปดาห์)</option>
                    <option value="1.55">ปานกลาง (ออกกำลัง 3-5 วัน/สัปดาห์)</option>
                    <option value="1.725">หนัก (ออกกำลัง 6-7 วัน/สัปดาห์)</option>
                </select>
            </div>
            <div class="form-group">
                <label>เป้าหมาย</label>
                <select id="i-goal">
                    <option value="-500">ลดน้ำหนัก (-500 Kcal)</option>
                    <option value="0">รักษาน้ำหนัก</option>
                    <option value="500">เพิ่มกล้ามเนื้อ (+500 Kcal)</option>
                </select>
            </div>
            <div class="form-group">
                <label>API Key (ทิ้งไว้ได้ ผมฝังให้แล้ว)</label>
                <input type="text" id="i-apikey">
            </div>
            <button class="btn-save" onclick="saveProfile()">คำนวณเป้าหมาย & ปิด</button>
        </div>
    </div>

<script>
    // System Config
    const _k = ['AQ.Ab8','RN6KOCO','BdFbJzr','ZqMEDzH','nzJcepU','uKux98B','DvyO0XL','VVbYA'].join('');
    
    // UI Elements
    const imgInp = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const pholder = document.getElementById('uploadPlaceholder');
    const btn = document.getElementById('analyzeBtn');
    const loader = document.getElementById('loader');
    const resBox = document.getElementById('resultText');
    let base64Img = "";

    // State
    let history = JSON.parse(localStorage.getItem('c_hist')) || [];
    let profile = JSON.parse(localStorage.getItem('c_prof')) || {
        g: 'M', a: 25, w: 70, h: 170, act: 1.2, goal: -500, key: _k
    };
    let targets = { cal: 2000, p: 140, c: 200, f: 55 }; // defaults

    // Core Logic
    function calculateTDEE() {
        let bmr = profile.g === 'M' 
            ? (10 * profile.w) + (6.25 * profile.h) - (5 * profile.a) + 5
            : (10 * profile.w) + (6.25 * profile.h) - (5 * profile.a) - 161;
        
        let tdee = Math.round(bmr * Number(profile.act));
        let targetCal = tdee + Number(profile.goal);
        
        // Macros: Protein = 2g/kg (or 2.2 for cuts), Fat = 25% of cals, Carbs = rest
        let p = Math.round(profile.w * 2);
        let f = Math.round((targetCal * 0.25) / 9);
        let c = Math.round((targetCal - (p*4) - (f*9)) / 4);

        targets = { cal: targetCal, p, c, f };
    }

    function updateDashboard() {
        // Sum history
        let cur = { cal: 0, p: 0, c: 0, f: 0 };
        history.forEach(i => {
            cur.cal += i.cal; cur.p += i.p; cur.c += i.c; cur.f += i.f;
        });

        // Update UI
        let remCal = targets.cal - cur.cal;
        document.getElementById('calRemain').textContent = remCal;
        document.getElementById('calRemain').style.color = remCal < 0 ? '#EF4444' : 'white';
        
        // Border color logic based on %
        let pct = (cur.cal / targets.cal) * 100;
        let bColor = pct > 100 ? '#EF4444' : 'var(--primary)';
        document.getElementById('circleBorder').style.borderTopColor = bColor;
        document.getElementById('circleBorder').style.borderRightColor = pct > 25 ? bColor : 'rgba(255,255,255,0.1)';
        document.getElementById('circleBorder').style.borderBottomColor = pct > 50 ? bColor : 'rgba(255,255,255,0.1)';
        document.getElementById('circleBorder').style.borderLeftColor = pct > 75 ? bColor : 'rgba(255,255,255,0.1)';

        // Macros
        document.getElementById('barPro').style.width = Math.min((cur.p/targets.p)*100, 100) + '%';
        document.getElementById('textPro').textContent = `${cur.p} / ${targets.p}g`;
        
        document.getElementById('barCarb').style.width = Math.min((cur.c/targets.c)*100, 100) + '%';
        document.getElementById('textCarb').textContent = `${cur.c} / ${targets.c}g`;
        
        document.getElementById('barFat').style.width = Math.min((cur.f/targets.f)*100, 100) + '%';
        document.getElementById('textFat').textContent = `${cur.f} / ${targets.f}g`;

        // Render List
        const list = document.getElementById('historyList');
        if(!history.length) {
            list.innerHTML = '<p style="text-align:center;color:var(--text-light);padding:20px 0;font-size:14px;">ยังไม่มีข้อมูล</p>';
            return;
        }
        list.innerHTML = history.map(i => `
            <div class="history-item">
                <img src="${i.img}" class="h-img">
                <div class="h-info">
                    <div class="h-name">${i.name}</div>
                    <div class="h-time">${i.time}</div>
                </div>
                <div>
                    <div class="h-cal">${i.cal} Kcal</div>
                    <div class="h-mac">P:${i.p} C:${i.c} F:${i.f}</div>
                </div>
            </div>
        `).join('');
    }

    // Modal
    function openProfile() {
        document.getElementById('i-gender').value = profile.g;
        document.getElementById('i-age').value = profile.a;
        document.getElementById('i-weight').value = profile.w;
        document.getElementById('i-height').value = profile.h;
        document.getElementById('i-activity').value = profile.act;
        document.getElementById('i-goal').value = profile.goal;
        document.getElementById('i-apikey').value = profile.key || _k;
        document.getElementById('profileModal').classList.add('active');
    }
    function saveProfile() {
        profile = {
            g: document.getElementById('i-gender').value,
            a: Number(document.getElementById('i-age').value),
            w: Number(document.getElementById('i-weight').value),
            h: Number(document.getElementById('i-height').value),
            act: Number(document.getElementById('i-activity').value),
            goal: Number(document.getElementById('i-goal').value),
            key: document.getElementById('i-apikey').value.trim() || _k
        };
        localStorage.setItem('c_prof', JSON.stringify(profile));
        calculateTDEE();
        updateDashboard();
        document.getElementById('profileModal').classList.remove('active');
    }

    // AI Analysis
    imgInp.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                pholder.style.display = 'none';
                btn.style.display = 'block';
                resBox.style.display = 'none';
                base64Img = e.target.result.split(',')[1];
            }
            reader.readAsDataURL(file);
        }
    });

    async function analyzeFood() {
        btn.disabled = true; btn.textContent = "กำลังวิเคราะห์โครงสร้างอาหาร... 🧬";
        loader.style.display = "block"; resBox.style.display = "none";

        const prompt = `วิเคราะห์ภาพอาหารนี้แบบนักโภชนาการ: 
1. name: ชื่อเมนู (สั้นๆ)
2. calories: แคลอรี่ (ตัวเลขเพียว)
3. protein: โปรตีนเป็นกรัม (ตัวเลขเพียว)
4. carbs: คาร์โบไฮเดรตเป็นกรัม (ตัวเลขเพียว)
5. fat: ไขมันเป็นกรัม (ตัวเลขเพียว)
6. details: คำแนะนำด้านโภชนาการสั้นๆ
ตอบกลับเป็น JSON Format เท่านั้น { "name":"", "calories":0, "protein":0, "carbs":0, "fat":0, "details":"" }`;

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${profile.key}`;
            const response = await fetch(url, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Img } }] }],
                    generationConfig: { response_mime_type: "application/json" }
                })
            });
            const data = await response.json();
            
            if (response.ok) {
                const ai = JSON.parse(data.candidates[0].content.parts[0].text);
                ai.calories = Number(ai.calories)||0; ai.protein = Number(ai.protein)||0; 
                ai.carbs = Number(ai.carbs)||0; ai.fat = Number(ai.fat)||0;
                
                resBox.innerHTML = `
                    <div class="r-name">${ai.name}</div>
                    <div class="r-macros">
                        <span style="color:var(--primary)">🔥 ${ai.calories} Kcal</span>
                        <span style="color:var(--protein)">🍗 P: ${ai.protein}g</span>
                        <span style="color:var(--carbs)">🍚 C: ${ai.carbs}g</span>
                        <span style="color:var(--fat)">🥑 F: ${ai.fat}g</span>
                    </div>
                    <div class="r-desc">${ai.details}</div>
                `;
                resBox.style.display = "block";

                // Save
                let d = new Date();
                history.unshift({
                    name: ai.name, cal: ai.calories, p: ai.protein, c: ai.carbs, f: ai.fat,
                    time: d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'),
                    img: preview.src
                });
                if(history.length > 20) history.pop();
                localStorage.setItem('c_hist', JSON.stringify(history));
                updateDashboard();

            } else {
                alert("เกิดข้อผิดพลาดในการวิเคราะห์ (API Key อาจมีปัญหา)");
            }
        } catch (e) {
            alert("เชื่อมต่อไม่สำเร็จ โปรดลองใหม่");
        } finally {
            loader.style.display = "none"; btn.disabled = false; btn.textContent = "✨ สแกนอาหารจานต่อไป";
        }
    }

    function clearHistory() {
        if(confirm("ล้างข้อมูลของวันนี้?")) { history = []; localStorage.removeItem('c_hist'); updateDashboard(); }
    }

    // Startup
    if(!localStorage.getItem('c_prof')) openProfile();
    else { calculateTDEE(); updateDashboard(); }
</script>
</body>
</html>
